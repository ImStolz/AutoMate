name: automate
description: "AutoMate - Professional automotive expense and maintenance tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  # firebase_storage: ^11.5.6
  google_sign_in: ^6.1.6
  
  # Local Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  
  # UI & Navigation
  go_router: ^12.1.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Charts & Graphs
  fl_chart: ^0.65.0
  
  # Utilities
  uuid: ^4.2.1
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  
  # File handling & Export
  path_provider: ^2.1.1
  csv: ^5.0.2
  pdf: ^3.10.7
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Ads & Monetization
  google_mobile_ads: ^5.1.0
  
  # In-App Purchases & Subscriptions
  in_app_purchase: ^3.1.13
  
  # Onboarding & Tutorial
  introduction_screen: ^3.1.12
  showcaseview: ^3.0.0
  
  # Connectivity & Network
  connectivity_plus: ^6.0.5
  
  # Package Info
  package_info_plus: ^8.0.2
  
  # URL Launcher (for terms & privacy)
  url_launcher: ^6.3.0
  
  # Device Info
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  
  # Linting
  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
  
  # Fonts (temporarily disabled - font files not available)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700

flutter_intl:
  enabled: true
  class_name: S
  main_locale: es
  arb_dir: lib/l10n
  output_dir: lib/generated
